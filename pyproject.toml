[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petgen"
version = "0.1.0"
description = "AI-powered talking pet video generator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-genai>=1.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
    "ultralytics>=8.0",
    "chatterbox-tts>=0.1",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
petgen = "petgen.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
